app = "pulsedesk"
primary_region = "iad"

[processes]
  api = "node apps/api/main.js"
  worker = "node apps/worker/main.js"

[http_service]
  internal_port = 3000
  processes = ["api"]
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"
