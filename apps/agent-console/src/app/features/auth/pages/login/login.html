<div class="flex min-h-screen items-center justify-center p-6">
  <form
    class="flex w-full max-w-sm flex-col gap-4 rounded-lg border border-surface-700 bg-surface-900 p-6"
    (submit)="$event.preventDefault(); submit()"
  >
    <div class="flex items-center gap-2 font-mono text-pulse">
      <pd-pulse-trace [connected]="true" label="" />
      <span class="text-xs font-semibold tracking-wide uppercase">PulseDesk</span>
    </div>
    <h1 class="text-xl font-semibold">Sign in</h1>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-surface-400" for="email">Email</label>
      <pd-input-text
        id="email"
        type="email"
        placeholder="agent@pulsedesk.dev"
        [value]="email()"
        (valueChange)="email.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-surface-400" for="password">Password</label>
      <pd-input-text
        id="password"
        type="password"
        placeholder="••••••••"
        [value]="password()"
        (valueChange)="password.set($event)"
      />
    </div>

    @if (store.error(); as error) {
      <p class="text-sm text-critical">{{ error }}</p>
    }

    <pd-button
      label="Sign in"
      type="submit"
      severity="primary"
      [loading]="store.loading()"
    />
  </form>
</div>
