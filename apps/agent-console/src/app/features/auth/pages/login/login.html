<div class="flex min-h-screen items-center justify-center p-6">
  <form
    class="flex w-full max-w-sm flex-col gap-4 rounded border border-surface-200 p-6"
    (submit)="$event.preventDefault(); submit()"
  >
    <h1 class="text-xl font-semibold">Sign in</h1>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-surface-600" for="email">Email</label>
      <pd-input-text
        id="email"
        type="email"
        placeholder="agent@pulsedesk.dev"
        [value]="email()"
        (valueChange)="email.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-surface-600" for="password">Password</label>
      <pd-input-text
        id="password"
        type="password"
        placeholder="••••••••"
        [value]="password()"
        (valueChange)="password.set($event)"
      />
    </div>

    @if (store.error(); as error) {
      <p class="text-sm text-red-600">{{ error }}</p>
    }

    <pd-button
      label="Sign in"
      severity="primary"
      [loading]="store.loading()"
      (clicked)="submit()"
    />
  </form>
</div>
