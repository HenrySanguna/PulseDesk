name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - id: affected
        run: echo "projects=$(pnpm nx show projects --affected --json)" >> "$GITHUB_OUTPUT"

  lint-and-test:
    needs: affected
    if: needs.affected.outputs.projects != '[]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsedesk
          POSTGRES_PASSWORD: pulsedesk
          POSTGRES_DB: pulsedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsedesk -d pulsedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulsedesk:pulsedesk@localhost:5432/pulsedesk?schema=public
      REDIS_URL: redis://localhost:6379
      WIDGET_JWT_SECRET: ci-only-widget-jwt-secret-change-me-please-32chars
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - name: Apply migrations (proves citext extension applies cleanly)
        run: pnpm exec prisma migrate deploy

      - name: Re-apply migrations (proves idempotency on re-run)
        run: pnpm exec prisma migrate deploy

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx affected -t lint test --parallel=3

  e2e:
    needs: affected
    if: needs.affected.outputs.projects != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx affected -t e2e --parallel=1
